<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telecom Plataforma</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
    }

    .container {
      max-width: 480px;
      margin: 60px auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,.10);
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    h2 {
      margin-top: 0;
      text-align: center;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .secondary {
      background: #64748b;
    }

    .secondary:hover {
      background: #475569;
    }

    .hidden {
      display: none !important;
    }

    .status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      background: #f8fafc;
      white-space: pre-wrap;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .info {
      margin-top: 20px;
      padding: 18px;
      background: #eff6ff;
      border-radius: 10px;
    }

    .dato {
      margin: 10px 0;
      font-size: 18px;
    }

    .dato strong {
      display: inline-block;
      min-width: 90px;
    }

    .recovery-text {
      text-align: center;
      color: #475569;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- =====================================================
       LOGIN
       ===================================================== -->

  <div id="loginCard" class="card">

    <h1>Telecom Plataforma</h1>

    <p style="text-align:center;">
      Inicia sesión para continuar
    </p>

    <label for="username">Usuario</label>

    <input
      id="username"
      type="text"
      autocomplete="username"
      placeholder="Ingrese su usuario"
    >

    <label for="password">Contraseña</label>

    <input
      id="password"
      type="password"
      autocomplete="current-password"
      placeholder="Ingrese su contraseña"
    >

    <button id="loginButton" onclick="login()">
      INICIAR SESIÓN
    </button>

    <div id="loginStatus" class="status hidden"></div>

  </div>


  <!-- =====================================================
       RECUPERAR / CAMBIAR CONTRASEÑA
       ===================================================== -->

  <div id="recoveryCard" class="card hidden">

    <h1>Telecom Plataforma</h1>

    <h2>Cambiar contraseña</h2>

    <p class="recovery-text">
      Ingresa tu nueva contraseña para recuperar el acceso
      a tu cuenta.
    </p>

    <label for="newPassword">
      Nueva contraseña
    </label>

    <input
      id="newPassword"
      type="password"
      autocomplete="new-password"
      placeholder="Ingrese nueva contraseña"
    >

    <label for="confirmPassword">
      Confirmar contraseña
    </label>

    <input
      id="confirmPassword"
      type="password"
      autocomplete="new-password"
      placeholder="Repita la nueva contraseña"
    >

    <button id="changePasswordButton" onclick="changePassword()">
      CAMBIAR CONTRASEÑA
    </button>

    <div id="recoveryStatus" class="status hidden"></div>

  </div>


  <!-- =====================================================
       PANEL PRINCIPAL
       ===================================================== -->

  <div id="appCard" class="card hidden">

    <h1>Telecom Plataforma</h1>

    <div class="info">

      <div class="dato">
        <strong>Usuario:</strong>
        <span id="loggedUser"></span>
      </div>

      <div class="dato">
        <strong>Rol:</strong>
        <span id="loggedRole"></span>
      </div>

    </div>

    <button onclick="iniciarLlamada()">
      INICIAR LLAMADA
    </button>

    <div id="callResult" class="info hidden">

      <div class="dato">
        <strong>Número:</strong>
        <span id="phoneNumber"></span>
      </div>

      <div class="dato">
        <strong>Nombre:</strong>
        <span id="personName"></span>
      </div>

      <div class="dato">
        <strong>ID:</strong>
        <span id="personId"></span>
      </div>

    </div>

    <button class="secondary" onclick="logout()">
      CERRAR SESIÓN
    </button>

  </div>

</div>


<script>

  // =========================================================
  // CONFIGURACIÓN SUPABASE
  // =========================================================

  const SUPABASE_URL =
    "https://mgxplczimlabdctrxslu.supabase.co";


  /*
    IMPORTANTE:

    Aquí debe ir tu clave pública ANON/PUBLISHABLE.

    NUNCA pongas aquí:
    - SERVICE_ROLE_KEY
    - secret key
  */

  const SUPABASE_ANON_KEY =
    "sb_publishable_kj-yp8h9txezMg6cpjOyMQ_k3UCEH88";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


  // =========================================================
  // DETECTAR RECUPERACIÓN DE CONTRASEÑA
  // =========================================================

  supabaseClient.auth.onAuthStateChange(
    async (event, session) => {

      console.log(
        "Evento Supabase Auth:",
        event
      );


      /*
        Cuando el usuario abre el enlace enviado por
        Supabase para recuperar la contraseña, Supabase
        genera el evento PASSWORD_RECOVERY.

        En ese momento mostramos el formulario para
        crear la nueva contraseña.
      */

      if (event === "PASSWORD_RECOVERY") {

        document
          .getElementById("loginCard")
          .classList.add("hidden");

        document
          .getElementById("appCard")
          .classList.add("hidden");

        document
          .getElementById("recoveryCard")
          .classList.remove("hidden");

      }

    }
  );


  // =========================================================
  // LOGIN CON USUARIO
  // =========================================================

  async function login() {

    const username =
      document
        .getElementById("username")
        .value
        .trim();


    const password =
      document
        .getElementById("password")
        .value;


    const status =
      document
        .getElementById("loginStatus");


    const button =
      document
        .getElementById("loginButton");


    if (!username || !password) {

      showStatus(
        "Debes ingresar usuario y contraseña.",
        "error"
      );

      return;
    }


    button.disabled = true;

    button.textContent =
      "INICIANDO...";


    try {

      const response =
        await fetch(
          SUPABASE_URL +
          "/functions/v1/username-login",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json",

              "apikey":
                SUPABASE_ANON_KEY
            },

            body: JSON.stringify({
              username: username,
              password: password
            })
          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.error ||
          "Usuario o contraseña incorrectos."
        );

      }


      if (
        !data.access_token ||
        !data.refresh_token
      ) {

        throw new Error(
          "La función de login no devolvió los tokens necesarios."
        );

      }


      const {
        error: sessionError
      } =
        await supabaseClient.auth.setSession({

          access_token:
            data.access_token,

          refresh_token:
            data.refresh_token

        });


      if (sessionError) {
        throw sessionError;
      }


      document
        .getElementById("loginCard")
        .classList.add("hidden");


      document
        .getElementById("appCard")
        .classList.remove("hidden");


      document
        .getElementById("loggedUser")
        .textContent =
        data.user?.username ||
        username;


      document
        .getElementById("loggedRole")
        .textContent =
        data.user?.role ||
        "usuario";


      showStatus(
        "Sesión iniciada correctamente.",
        "success"
      );


    } catch (error) {

      console.error(
        "Error de login:",
        error
      );


      showStatus(
        error.message ||
        "Error al iniciar sesión.",
        "error"
      );


    } finally {

      button.disabled = false;

      button.textContent =
        "INICIAR SESIÓN";

    }

  }


  // =========================================================
  // CAMBIAR CONTRASEÑA
  // =========================================================

  async function changePassword() {

    const newPassword =
      document
        .getElementById("newPassword")
        .value;


    const confirmPassword =
      document
        .getElementById("confirmPassword")
        .value;


    const status =
      document
        .getElementById("recoveryStatus");


    const button =
      document
        .getElementById("changePasswordButton");


    // -------------------------------------------------------
    // VALIDACIONES
    // -------------------------------------------------------

    if (!newPassword || !confirmPassword) {

      showRecoveryStatus(
        "Debes completar los dos campos.",
        "error"
      );

      return;
    }


    if (newPassword.length < 6) {

      showRecoveryStatus(
        "La contraseña debe tener al menos 6 caracteres.",
        "error"
      );

      return;
    }


    if (newPassword !== confirmPassword) {

      showRecoveryStatus(
        "Las contraseñas no coinciden.",
        "error"
      );

      return;
    }


    button.disabled = true;

    button.textContent =
      "GUARDANDO...";


    try {

      /*
        Supabase actualiza la contraseña del usuario
        que acaba de llegar mediante el enlace de
        recuperación.
      */

      const {
        error
      } =
        await supabaseClient.auth.updateUser({
          password: newPassword
        });


      if (error) {
        throw error;
      }


      showRecoveryStatus(
        "Contraseña cambiada correctamente. Ya puedes iniciar sesión.",
        "success"
      );


      document
        .getElementById("newPassword")
        .value = "";


      document
        .getElementById("confirmPassword")
        .value = "";


      /*
        Después de unos segundos volvemos al login.
      */

      setTimeout(
        async () => {

          await supabaseClient.auth.signOut();


          document
            .getElementById("recoveryCard")
            .classList.add("hidden");


          document
            .getElementById("loginCard")
            .classList.remove("hidden");


          document
            .getElementById("loginStatus")
            .classList.add("hidden");

        },
        2000
      );


    } catch (error) {

      console.error(
        "Error cambiando contraseña:",
        error
      );


      showRecoveryStatus(
        error.message ||
        "No se pudo cambiar la contraseña.",
        "error"
      );


    } finally {

      button.disabled = false;

      button.textContent =
        "CAMBIAR CONTRASEÑA";

    }

  }


  // =========================================================
  // INICIAR LLAMADA
  // =========================================================

  function iniciarLlamada() {

    /*
      POR AHORA mostramos datos de prueba.

      Después conectaremos esta función con la tabla
      de clientes/contactos de Supabase.
    */

    document
      .getElementById("phoneNumber")
      .textContent =
      "+56 9 0000 0000";


    document
      .getElementById("personName")
      .textContent =
      "Cliente de prueba";


    document
      .getElementById("personId")
      .textContent =
      "ID-000001";


    document
      .getElementById("callResult")
      .classList
      .remove("hidden");

  }


  // =========================================================
  // CERRAR SESIÓN
  // =========================================================

  async function logout() {

    await supabaseClient.auth.signOut();


    document
      .getElementById("appCard")
      .classList.add("hidden");


    document
      .getElementById("loginCard")
      .classList.remove("hidden");


    document
      .getElementById("password")
      .value = "";


    document
      .getElementById("callResult")
      .classList.add("hidden");

  }


  // =========================================================
  // MENSAJE LOGIN
  // =========================================================

  function showStatus(
    message,
    type
  ) {

    const status =
      document
        .getElementById("loginStatus");


    status.textContent =
      message;


    status.className =
      "status " + type;


    status.classList
      .remove("hidden");

  }


  // =========================================================
  // MENSAJE RECUPERACIÓN
  // =========================================================

  function showRecoveryStatus(
    message,
    type
  ) {

    const status =
      document
        .getElementById("recoveryStatus");


    status.textContent =
      message;


    status.className =
      "status " + type;


    status.classList
      .remove("hidden");

  }

</script>

</body>
</html>
