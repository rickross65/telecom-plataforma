<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Telecom Plataforma</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .container {
      width: 100%;
      max-width: 850px;
      margin: 0 auto;
      padding: 25px 15px 50px;
    }

    .header {
      background: white;
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 3px 15px rgba(0,0,0,.08);
    }

    .header h1 {
      margin: 0 0 15px;
      font-size: 30px;
    }

    .status {
      padding: 14px;
      border-radius: 8px;
      background: #eff6ff;
      color: #1e3a8a;
      word-break: break-word;
      line-height: 1.5;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 3px 15px rgba(0,0,0,.08);
    }

    .card h2 {
      margin-top: 0;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 15px;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 8px;
      padding: 14px;
      margin-top: 20px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1f2937;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .secondary {
      background: #4b5563;
    }

    .success {
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }

    .error {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .hidden {
      display: none !important;
    }

    .user-info {
      font-size: 18px;
      margin-bottom: 15px;
    }

    .info-box {
      background: #f9fafb;
      border-radius: 8px;
      padding: 15px;
      margin-top: 15px;
      line-height: 1.6;
    }

    .small {
      font-size: 13px;
      color: #6b7280;
      margin-top: 8px;
    }

  </style>
</head>

<body>

<div class="container">

  <!-- ENCABEZADO -->
  <div class="header">

    <h1>Telecom Plataforma</h1>

    <div id="status" class="status">
      Cargando aplicación...
    </div>

  </div>


  <!-- CONEXIÓN SUPABASE -->
  <div id="connectionCard" class="card">

    <h2>Conectar con Supabase</h2>

    <label for="projectUrl">
      Project URL
    </label>

    <input
      id="projectUrl"
      type="text"
      value="https://mgxplczimlabdctrxslu.supabase.co"
      autocomplete="off"
    >

    <label for="anonKey">
      Publishable / Anon Key
    </label>

    <input
      id="anonKey"
      type="password"
      placeholder="Pega aquí tu Publishable / Anon Key"
      autocomplete="off"
    >

    <button id="connectButton">
      CONECTAR
    </button>

    <div class="small">
      La URL debe terminar en .supabase.co y NO debe contener /rest/v1/
    </div>

  </div>


  <!-- LOGIN -->
  <div id="loginCard" class="card hidden">

    <h2>Iniciar sesión</h2>

    <label for="username">
      Usuario
    </label>

    <input
      id="username"
      type="text"
      placeholder="Ejemplo: Usuario1"
      autocomplete="username"
    >

    <label for="password">
      Contraseña
    </label>

    <input
      id="password"
      type="password"
      placeholder="Contraseña"
      autocomplete="current-password"
    >

    <button id="loginButton">
      INICIAR SESIÓN
    </button>

  </div>


  <!-- PANEL -->
  <div id="dashboardCard" class="card hidden">

    <h2>Panel principal</h2>

    <div class="user-info">
      Usuario conectado:
      <strong id="loggedUsername"></strong>
    </div>

    <div class="info-box">

      <strong>Conexión correcta</strong>

      <br><br>

      Supabase está conectado y la sesión está activa.

      <br><br>

      Rol:
      <strong id="loggedRole"></strong>

    </div>

    <button id="logoutButton" class="secondary">
      CERRAR SESIÓN
    </button>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

"use strict";


/* =========================================================
   CONFIGURACIÓN
========================================================= */

var supabaseClient = null;

/* =========================================================
   ELEMENTOS
========================================================= */

  document.getElementById("connectionCard");

  document.getElementById("connectButton");

var loginButton =
  document.getElementById("loginButton");

var logoutButton =
  document.getElementById("logoutButton");


/* =========================================================
   ESTADO
========================================================= */

function setStatus(message, type) {

  statusBox.innerHTML = message;

  statusBox.className = "status";

  if (type === "success") {
    statusBox.classList.add("success");
  }

  if (type === "error") {
    statusBox.classList.add("error");
  }

}


/* =========================================================
   INICIO
========================================================= */

document.addEventListener("DOMContentLoaded", function() {

  setStatus(
    "JavaScript funcionando correctamente. Aplicación lista.",
    "success"
  );

});
