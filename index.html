<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telecom Plataforma</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,.1);
      margin-bottom: 20px;
    }

    h1 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: 0;
      border-radius: 7px;
      background: #111827;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #374151;
    }

    #status {
      margin-top: 15px;
      padding: 12px;
      background: #eef2ff;
      border-radius: 7px;
      word-break: break-word;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">
    <h1>Telecom Plataforma</h1>

    <div id="status">
      Página cargada correctamente.
    </div>
  </div>

  <div class="card" id="conexion">

    <h2>Conectar con Supabase</h2>

    <label for="projectUrl">Project URL</label>

    <input
      id="projectUrl"
      type="text"
      value="https://mgxplczimlabdctrxslu.supabase.co"
      placeholder="https://xxxx.supabase.co"
    >

    <label for="anonKey">Publishable / Anon Key</label>

    <input
      id="anonKey"
      type="password"
      placeholder="Pega aquí tu clave"
    >

    <button id="connectButton">
      CONECTAR
    </button>

  </div>

  <div class="card hidden" id="login">

    <h2>Iniciar sesión</h2>

    <label for="username">Usuario</label>

    <input
      id="username"
      type="text"
      placeholder="Usuario"
    >

    <label for="password">Contraseña</label>

    <input
      id="password"
      type="password"
      placeholder="Contraseña"
    >

    <button id="loginButton">
      INICIAR SESIÓN
    </button>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

console.log("JAVASCRIPT INICIADO");

var supabaseClient = null;

var statusBox = document.getElementById("status");
var connectButton = document.getElementById("connectButton");
var loginButton = document.getElementById("loginButton");

statusBox.innerHTML = "JavaScript cargado correctamente.";

connectButton.onclick = function () {

  statusBox.innerHTML = "Conectando...";

  var url = document.getElementById("projectUrl").value.trim();
  var key = document.getElementById("anonKey").value.trim();

  if (!url) {
    statusBox.innerHTML = "ERROR: falta Project URL.";
    return;
  }

  if (!key) {
    statusBox.innerHTML = "ERROR: falta Publishable / Anon Key.";
    return;
  }

  if (typeof window.supabase === "undefined") {
    statusBox.innerHTML =
      "ERROR: Supabase JS no se pudo cargar. Revisa la conexión a Internet.";
    return;
  }

  try {

    supabaseClient = window.supabase.createClient(url, key);

    statusBox.innerHTML =
      "CONEXIÓN CONFIGURADA CORRECTAMENTE. Probando Supabase...";

    supabaseClient.auth.getSession()
      .then(function(result) {

        if (result.error) {

          statusBox.innerHTML =
            "Supabase respondió, pero devolvió error:<br>" +
            result.error.message;

          return;
        }

        statusBox.innerHTML =
          "SUPABASE CONECTADO CORRECTAMENTE.";

        document.getElementById("login").classList.remove("hidden");

        connectButton.innerHTML = "CONECTADO";

      })
      .catch(function(error) {

        statusBox.innerHTML =
          "Error al consultar Supabase:<br>" +
          error.message;

      });

  } catch (error) {

    statusBox.innerHTML =
      "ERROR CREANDO CONEXIÓN:<br>" +
      error.message;

  }

};


loginButton.onclick = async function () {

  if (!supabaseClient) {

    statusBox.innerHTML =
      "Primero debes conectar Supabase.";

    return;

  }

  var username =
    document.getElementById("username").value.trim();

  var password =
    document.getElementById("password").value;

  if (!username || !password) {

    statusBox.innerHTML =
      "Escribe usuario y contraseña.";

    return;

  }

  statusBox.innerHTML =
    "Iniciando sesión...";

  try {

    var result =
      await supabaseClient.functions.invoke(
        "username-login",
        {
          body: {
            username: username,
            password: password
          }
        }
      );

    if (result.error) {

      statusBox.innerHTML =
        "Error de Edge Function:<br>" +
        result.error.message;

      return;
    }

    var data = result.data;

    if (!data) {

      statusBox.innerHTML =
        "La función no devolvió datos.";

      return;

    }

    if (data.error) {

      statusBox.innerHTML =
        "Error de acceso:<br>" +
        data.error;

      return;

    }

    if (data.access_token && data.refresh_token) {

      var sessionResult =
        await supabaseClient.auth.setSession({

          access_token: data.access_token,
          refresh_token: data.refresh_token

        });

      if (sessionResult.error) {

        statusBox.innerHTML =
          "Error guardando sesión:<br>" +
          sessionResult.error.message;

        return;

      }

      statusBox.innerHTML =
        "INICIO DE SESIÓN CORRECTO.<br>" +
        "Usuario: " +
        (data.user && data.user.username
          ? data.user.username
          : username);

      return;

    }

    statusBox.innerHTML =
      "La autenticación respondió, pero no entregó tokens.";

  } catch (error) {

    statusBox.innerHTML =
      "ERROR DE LOGIN:<br>" +
      error.message;

  }

};

</script>

</body>
</html>
